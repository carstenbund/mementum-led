# Drop-in for the packaged hostapd.service. Installed by install.sh to
# /etc/systemd/system/hostapd.service.d/10-mementum.conf
#
# Runs the AP-prepare step right before hostapd starts, so wlan0 is released from
# NetworkManager / wpa_supplicant and given the static AP IP on every start --
# including reboots and 'systemctl restart hostapd'. Kept as a drop-in so it
# survives hostapd package upgrades.

[Service]
ExecStartPre=/usr/local/sbin/mementum-ap-prepare
