# Drop-in for the packaged dnsmasq.service. Installed by install.sh to
# /etc/systemd/system/dnsmasq.service.d/10-mementum.conf
#
# Ties DHCP to the access point: dnsmasq only starts once hostapd is up, and the
# static AP address is re-asserted just before dnsmasq binds (the leading '-'
# makes it a no-op if the address is already present). This guards against the
# IP being dropped when the radio is switched into AP mode, which would otherwise
# leave dnsmasq unable to bind wlan0 and clients with no DHCP offers.

[Unit]
After=hostapd.service
Requires=hostapd.service

[Service]
ExecStartPre=-/usr/sbin/ip addr add 10.10.10.1/24 dev wlan0
