# Tell NetworkManager to permanently leave wlan0 alone so hostapd can own it as
# an access point. Without this, NetworkManager (the default on Raspberry Pi OS
# Bookworm) keeps wlan0 as a Wi-Fi *client*, which prevents hostapd from putting
# the radio into AP mode -- so no clients associate and no DHCP is offered.
#
# Only wlan0 is released; every other interface (eth0, etc.) stays managed.
#
# Installed to /etc/NetworkManager/conf.d/99-mementum-unmanaged.conf by install.sh.

[keyfile]
unmanaged-devices=interface-name:wlan0
