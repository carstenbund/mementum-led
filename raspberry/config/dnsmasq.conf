# dnsmasq configuration for the Mementum LED access point.
#
# Hands out DHCP leases to the ESP32 clients on the 10.10.10.0/24 network.
# The server itself is statically 10.10.10.1 (matches serverAddress in ws_wifi.cpp),
# so the lease pool starts at .2. Up to ~20 clients in this configuration.
#
# Installed to /etc/dnsmasq.d/mementum.conf by install.sh.

interface=wlan0
bind-interfaces

# Only serve DHCP on the AP subnet; leave the .1 host address for the server.
# Pool .2-.250 (~249 leases) so the /24 is not the bottleneck for client count.
# To go beyond a single /24 (250+ clients) widen the netmask to /23 here and in
# dhcpcd.append.conf, and use AP hardware that can associate that many stations.
dhcp-range=10.10.10.2,10.10.10.250,255.255.255.0,24h

# Point clients' default gateway/DNS at the server itself.
dhcp-option=3,10.10.10.1
dhcp-option=6,10.10.10.1

# Resolve everything to the server so a captive-style "http://10.10.10.1" always works.
address=/#/10.10.10.1
