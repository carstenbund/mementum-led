# Static IP for the AP interface, appended to /etc/dhcpcd.conf by install.sh.
#
# The ESP32 clients connect to the server at http://10.10.10.1 (ws_wifi.cpp),
# so wlan0 must own that address. nohook wpa_supplicant keeps dhcpcd from trying
# to make wlan0 a client of some other network.

interface wlan0
    static ip_address=10.10.10.1/24
    nohook wpa_supplicant
