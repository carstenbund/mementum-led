# hostapd configuration for the Mementum LED access point.
#
# These values must match what the ESP32 clients scan for. The clients read
# APSSID / APPSK from data/config.csv (default mementumLED / mementumLED) and
# connect to the server at 10.10.10.1, channel 1 (see ws_wifi.cpp).
#
# Installed to /etc/hostapd/hostapd.conf by install.sh.

interface=wlan0
driver=nl80211

# SSID / passphrase the ESP32 clients look for (data/config.csv: APSSID/APPSK)
ssid=mementumLED
wpa_passphrase=mementumLED

# 2.4 GHz, channel 1 (matches WiFi.softAP(ssid, pw, 1, 0, 16) in ws_wifi.cpp)
hw_mode=g
channel=1

# Association cap. The dedicated server can drive ~50 clients (concurrent broadcast),
# but the ACCESS POINT hardware is the real limit: the built-in Raspberry Pi radio
# reliably handles only ~8-16 AP clients regardless of this value. For ~50 real clients
# use an external USB adapter or a dedicated AP/router. This number only raises the
# ceiling; it does not make weak radio hardware serve more.
max_num_sta=64

wmm_enabled=0
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0

# WPA2-PSK only
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
