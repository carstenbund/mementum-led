<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mementum LED</title>
      <style>
        /* Existing styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
        }
        .header {
            text-align: center;
            padding: 20px 0;
            background-color: #333;
            color: #fff;
            margin-bottom: 20px;
        }
        .container {
            max-width: 800px; /* Increased width to accommodate new sections */
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
        }
        .input-container, .sent-strings-container, .pre-made-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
        .input-container label {
            width: 100%;
            text-align: center;
            margin-bottom: 10px;
        }
        .input-container input[type="text"] {
            flex: 1;
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
            margin-bottom: 10px;
            width: 80%;
        }
        .radio-buttons, .pre-made-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }
        .radio-buttons button, .pre-made-buttons button {
            padding: 5px 10px;
            background-color: #333;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            border: none;
            border-radius: 2px;
            text-transform: uppercase;
            cursor: pointer;
        }
        .radio-buttons button:hover, .pre-made-buttons button:hover {
            background-color: #555;
        }
        .input-container button, .button-container button, .sent-strings-container button,
        #fragmentSection button {
            padding: 5px 10px;
            background-color: #333;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 3px;
            text-transform: uppercase;
            cursor: pointer;
            margin-right: 5px;
        }
        .sent-strings-list {
            width: 80%;
            border: 1px solid #ccc;
            border-radius: 3px;
            padding: 10px;
            max-height: 150px;
            overflow-y: auto;
        }
        /* Status / debug panel */
        table.clients { width: 100%; border-collapse: collapse; font-size: 13px; }
        .clients th, .clients td { border: 1px solid #ddd; padding: 4px 7px; text-align: left; }
        .clients th { background: #333; color: #fff; }
        .clients tr.row-off { color: #999; }
        .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
        .dot.on { background: #2ecc40; }
        .dot.off { background: #bbb; }
        .controls { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
        .controls label { display: flex; align-items: center; gap: 5px; font-size: 13px; }
        #logWindow {
            background: #111; color: #ddd; font-family: monospace; font-size: 12px;
            height: 240px; overflow-y: auto; padding: 8px; border-radius: 3px; white-space: pre-wrap;
        }
        #logWindow .log-info  { color: #7CFC00; }
        #logWindow .log-debug { color: #6cb6ff; }
        .muted { font-size: 13px; color: #777; font-weight: normal; }
        /* Fragment edit mask */
        .fragment-list, .frag-add { width: 80%; margin: 0 auto; }
        .frag-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
        .frag-row input[type="text"] {
            flex: 1; padding: 5px; border: 1px solid #ccc; border-radius: 3px;
        }
        .frag-add { margin-top: 10px; }
    </style>
</head>
<body>
    <script defer="defer">
        var selectedColor = '';
        var sentStrings = [];
        var preMadeStrings = [];

        function setColor(color) {
            selectedColor = color;
            if (document.getElementById('Text').value.trim()) {
                sendData();
            }
        }

        function sendData() {
            var textData = document.getElementById('Text').value;
            textData = selectedColor + textData;
            // Attach this string's own repeat count, captured from the input at send
            // time, so each message can repeat a different number of times.
            var plays = parseInt(document.getElementById('maxPlays').value, 10);
            var url = '/SendData?data=' + encodeURIComponent(textData);
            if (!isNaN(plays)) url += '&plays=' + plays;
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    fetchSentStrings(); // Refresh only after the server stored it
                }
            };
            xhr.send();
        }

        // RGB On (2) / Off (3) — was referenced by the buttons but never defined.
        function ledSwitch(n) {
            var endpoint = (n === 2) ? '/RGBOn' : '/RGBOff';
            var xhr = new XMLHttpRequest();
            xhr.open('GET', endpoint, true);
            xhr.send();
        }

        function clearText() {
            document.getElementById('Text').value = '';
            selectedColor = '';
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/clear', true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    // /clear returns plain text, not JSON — just re-fetch the list.
                    fetchSentStrings();
                }
            };
            xhr.send();
        }

        function deleteSelectedEntries() {
            var selectedIndexes = [];
            var checkboxes = document.querySelectorAll('#sentStringsList input[type="checkbox"]');

            checkboxes.forEach((checkbox, index) => {
                if (checkbox.checked) {
                    selectedIndexes.push(index); // Collect the index of checked items
                }
            });

            if (selectedIndexes.length > 0) {
                // Server reads "indexes" as a query param, not a JSON body.
                var xhr = new XMLHttpRequest();
                xhr.open('GET', '/deleteSelected?indexes=' + selectedIndexes.join(','), true);
                xhr.onreadystatechange = function() {
                    if (xhr.readyState === 4 && xhr.status === 200) {
                        try {
                            sentStrings = JSON.parse(xhr.responseText);
                            displaySentStrings();
                        } catch (e) {
                            fetchSentStrings();
                        }
                    }
                };
                xhr.send();
            } else {
                alert('No items selected for deletion.');
            }
        }


        // "Play again": reset the play count for the checkmarked stored strings so the
        // sequencer schedules them again. Mirrors the firmware's /resetPlayCount handler
        // (with no selection it resets all, exactly like the C++ version).
        function playAgain() {
            var selectedIndexes = [];
            var checkboxes = document.querySelectorAll('#sentStringsList input[type="checkbox"]');
            checkboxes.forEach(function(checkbox, index) {
                if (checkbox.checked) selectedIndexes.push(index);
            });
            var url = '/resetPlayCount';
            if (selectedIndexes.length > 0) {
                url += '?indexes=' + selectedIndexes.join(',');
            }
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.send();
        }

        // Three distinct repeat controls:
        //  - "Wiederholungen (nächster Text)" (#maxPlays): per-string count, read by
        //    sendData() and passed as &plays=N, stored with that one string.
        //  - "Standard-Wiederholungen" (#defaultPlays): the preset that pre-fills the
        //    per-string box; used for any send that doesn't set an individual count.
        //  - "Globales Wiederholungslimit" (#globalMaxPlays): the hard ceiling. No
        //    string ever plays more than this (effective = min(perString, ceiling));
        //    a live throttle over the whole wall.
        // On load all seed from /getConfig; the per-string box pre-fills with the
        // preset default (not the ceiling).
        function fetchConfig() {
            fetch('/getConfig').then(function(r) {
                return r.ok ? r.json() : null;
            }).then(function(d) {
                if (!d) return;
                document.getElementById('globalMaxPlays').value = d.max_plays;
                document.getElementById('defaultPlays').value = d.default_plays;
                document.getElementById('maxPlays').value = d.default_plays;
            }).catch(function() {});
        }

        // Small helper: validate 1..99, POST to a config setter, flash a status hint,
        // and run an optional onOk(data) with the server's confirmed value.
        function pushConfigValue(route, inputId, statusId, onOk) {
            var input = document.getElementById(inputId);
            var status = document.getElementById(statusId);
            var v = parseInt(input.value, 10);
            if (isNaN(v) || v < 1 || v > 99) {
                status.textContent = 'ungültig (1–99)';
                return;
            }
            fetch(route + '?value=' + v).then(function(r) {
                return r.ok ? r.json() : Promise.reject();
            }).then(function(d) {
                if (onOk) onOk(d);
                status.textContent = 'gespeichert';
                setTimeout(function() { status.textContent = ''; }, 1500);
            }).catch(function() {
                status.textContent = 'Fehler';
            });
        }

        function setGlobalMaxPlays() {
            pushConfigValue('/setMaxPlays', 'globalMaxPlays', 'globalMaxPlaysStatus',
                function(d) { document.getElementById('globalMaxPlays').value = d.max_plays; });
        }

        function setDefaultPlays() {
            pushConfigValue('/setDefaultPlays', 'defaultPlays', 'defaultPlaysStatus',
                function(d) {
                    document.getElementById('defaultPlays').value = d.default_plays;
                    // Re-pre-fill the per-string box so the next text uses the new default.
                    document.getElementById('maxPlays').value = d.default_plays;
                });
        }

        function fetchSentStrings() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/getData', true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    sentStrings = JSON.parse(xhr.responseText);
                    displaySentStrings();
                }
            };
            xhr.send();
        }

        function fetchPreMadeStrings() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/getPreMade', true);
            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    preMadeStrings = JSON.parse(xhr.responseText);
                    displayPreMadeStrings();
                }
            };
            xhr.send();
        }

        // ---- Fragment edit mask (SQLite-backed "Vorgaben"; Pi server only) ----
        function toggleConfig() {
            var body = document.getElementById('configBody');
            var open = body.style.display === 'none';
            body.style.display = open ? 'block' : 'none';
            document.getElementById('configCaret').innerHTML = open ? '&#9662;' : '&#9656;';
        }

        function toggleFragments() {
            var body = document.getElementById('fragmentBody');
            var open = body.style.display === 'none';
            body.style.display = open ? 'block' : 'none';
            document.getElementById('fragmentCaret').innerHTML = open ? '&#9662;' : '&#9656;';
        }

        function fetchFragments() {
            fetch('/fragments').then(function(r) {
                if (!r.ok) throw new Error('no /fragments');
                return r.json();
            }).then(renderFragments).catch(function() {
                var s = document.getElementById('fragmentSection');
                if (s) s.style.display = 'none';   // endpoint absent (e.g. ESP32 server)
            });
        }

        function renderFragments(list) {
            var box = document.getElementById('fragmentList');
            box.innerHTML = '';
            list.forEach(function(f) {
                var row = document.createElement('div');
                row.className = 'frag-row';
                row.innerHTML =
                    '<input type="text" maxlength="100" id="frag' + f.id + '">' +
                    '<button onclick="updateFragment(' + f.id + ')">Speichern</button>' +
                    '<button onclick="deleteFragment(' + f.id + ')">Löschen</button>';
                box.appendChild(row);
                // Assign value as a property so quotes/special chars can't break markup.
                document.getElementById('frag' + f.id).value = f.text;
            });
        }

        function applyFragmentResult(r) {
            if (!r.ok) return null;
            return r.json();
        }
        function afterFragmentChange(list) {
            if (list) { renderFragments(list); fetchPreMadeStrings(); }
        }

        function addFragment() {
            var inp = document.getElementById('newFragment');
            var t = inp.value.trim();
            if (!t) return;
            fetch('/addFragment?text=' + encodeURIComponent(t))
                .then(applyFragmentResult)
                .then(function(list) { if (list) { inp.value = ''; afterFragmentChange(list); } });
        }

        function updateFragment(id) {
            var t = document.getElementById('frag' + id).value.trim();
            if (!t) return;
            fetch('/updateFragment?id=' + id + '&text=' + encodeURIComponent(t))
                .then(applyFragmentResult).then(afterFragmentChange);
        }

        function deleteFragment(id) {
            if (!confirm('Textbaustein löschen?')) return;
            fetch('/deleteFragment?id=' + id)
                .then(applyFragmentResult).then(afterFragmentChange);
        }

        function displaySentStrings() {
            var list = document.getElementById('sentStringsList');
            list.innerHTML = '';
            sentStrings.forEach(function(item, index) {
                // Tolerate both the rich payload ({text,plays,limit}) and a bare string.
                var text = (item && typeof item === 'object') ? item.text : item;
                var option = document.createElement('div');
                option.style.marginBottom = '5px';
                var badge = '';
                if (item && typeof item === 'object') {
                    badge = ` <span class="muted">(${item.plays}/${item.limit}×)</span>`;
                }
                option.innerHTML = `<input type="checkbox" id="sent${index}" value="${text}">
                                    <label for="sent${index}">${text}</label>${badge}`;
                list.appendChild(option);
            });
        }

        function displayPreMadeStrings() {
            var container = document.getElementById('preMadeList');
            container.innerHTML = '';
            preMadeStrings.forEach(function(str) {
                var button = document.createElement('button');
                button.textContent = str;
                button.onclick = function() {
                    document.getElementById('Text').value = str;
                };
                container.appendChild(button);
            });
        }

        // ---- Status window + debug log stream (Pi server only; degrades on firmware) ----
        var showDebug = false;
        var logPaused = false;
        var evtSource = null;
        var statusTimer = null;

        function fmtTime(epoch) {
            if (!epoch) return '-';
            return new Date(epoch * 1000).toLocaleTimeString();
        }
        function fmtAge(sec) {
            sec = Math.round(sec);
            if (sec < 60) return sec + 's';
            var m = Math.floor(sec / 60), s = sec % 60;
            if (m < 60) return m + 'm ' + s + 's';
            return Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
        }

        function fetchClients() {
            fetch('/clients').then(function(r) {
                if (!r.ok) throw new Error('no /clients');
                return r.json();
            }).then(renderClients).catch(function() {
                // Endpoint not available (e.g. ESP32-hosted server): hide the panel.
                var p = document.getElementById('statusSection');
                if (p) p.style.display = 'none';
                if (statusTimer) { clearInterval(statusTimer); statusTimer = null; }
            });
        }

        function renderClients(data) {
            var tb = document.getElementById('clientsBody');
            tb.innerHTML = '';
            var connected = 0;
            data.clients.forEach(function(c) {
                if (c.active) connected++;
                var tr = document.createElement('tr');
                if (!c.active) tr.className = 'row-off';
                tr.innerHTML =
                    '<td><span class="dot ' + (c.active ? 'on' : 'off') + '"></span></td>' +
                    '<td>' + c.id + '</td>' +
                    '<td>' + c.ip + '</td>' +
                    '<td>' + c.version + '</td>' +
                    '<td>' + fmtTime(c.first_seen) + '</td>' +
                    '<td>' + fmtTime(c.last_seen) + '</td>' +
                    '<td>' + (c.active ? 'connected' : ('gone ' + fmtAge(c.age) + ' ago')) + '</td>';
                tb.appendChild(tr);
            });
            document.getElementById('clientsSummary').textContent =
                connected + ' connected / ' + data.clients.length + ' known';
        }

        function appendLog(ev) {
            if (logPaused) return;
            if (ev.level === 'debug' && !showDebug) return;
            var w = document.getElementById('logWindow');
            var atBottom = (w.scrollHeight - w.clientHeight - w.scrollTop) < 30;
            var line = document.createElement('div');
            line.className = 'log-' + ev.level;
            line.textContent = ev.t + '  ' + ev.msg;
            w.appendChild(line);
            while (w.childNodes.length > 500) w.removeChild(w.firstChild);
            if (atBottom) w.scrollTop = w.scrollHeight;
        }

        function connectLog() {
            if (!window.EventSource) return;          // very old browser
            evtSource = new EventSource('/logstream');
            evtSource.onmessage = function(e) {
                try { appendLog(JSON.parse(e.data)); } catch (_) {}
            };
            // onerror: EventSource auto-reconnects; nothing to do.
        }

        function toggleDebugLog(cb) {
            document.getElementById('debugSection').style.display = cb.checked ? 'block' : 'none';
        }
        function toggleDebug(cb) { showDebug = cb.checked; }
        function togglePause(cb) { logPaused = cb.checked; }
        function clearLog() { document.getElementById('logWindow').innerHTML = ''; }

        window.onload = function() {
            fetch('/setBrowserTime?epoch=' + Math.floor(Date.now() / 1000)).catch(function(){});
            fetchSentStrings();
            fetchPreMadeStrings();
            fetchFragments();
            fetchConfig();
            fetchClients();
            statusTimer = setInterval(fetchClients, 2000);
            connectLog();
        };
    </script>
    <div class="header">
        <h1>mementum LED</h1>
    </div>
    <div class="container">
        <div class="input-container">
            <label for="input1">Text</label>
            <input type="text" id="Text" />
            <div class="radio-buttons">
                <button onclick="setColor('@red')" style="background-color: red;">Rot</button>
                <button onclick="setColor('@green')" style="background-color: green;">Grün</button>
                <button onclick="setColor('@blue')" style="background-color: blue;">Blau</button>
                <button onclick="setColor('@pink')" style="background-color: pink; color: #333;">Pink</button>
                <button onclick="setColor('@yellow')" style="background-color: yellow; color: #333;">Gelb</button>
                <button onclick="setColor('@cyan')" style="background-color: cyan; color: #333;">Cyan</button>
            </div>
            <button value="SendData" id="btn1" onclick="sendData()">Anzeigen</button><p></p>
            <button value="ClearText" id="btnClear" onclick="clearText()">Alle Löschen</button>
            <!-- <button onclick="deleteSelectedEntries()">Löschen</button> -->
        </div>
        <div class="sent-strings-container">
            <h3>Text Angezeigt:</h3>
            <div id="sentStringsList" class="sent-strings-list">
                <!-- Sent strings will be populated here -->
            </div>
            <p></p>
            <button value="PlayAgain" id="btnPlayAgain" onclick="playAgain()">Nochmal abspielen</button>
            <div class="frag-row" style="margin-top: 8px; align-items: center;">
                <label for="maxPlays">Wiederholungen (nächster Text):</label>
                <input type="number" id="maxPlays" min="1" max="99" step="1" value="3" style="width: 4em;">
            </div>
        </div>
        <div class="pre-made-container">
            <h3>Vorgaben:</h3>
            <div id="preMadeList" class="pre-made-buttons">
                <!-- Pre-made strings buttons will be populated here -->
            </div>
        </div>
        <div class="button-container">
            <button value="RGBOn" id="btn2" onclick="ledSwitch(2)">RGB On</button>
            <button value="RGBOff" id="btn3" onclick="ledSwitch(3)">RGB Off</button>
        </div>
    </div>

    <div class="container" id="fragmentSection">
        <h3 id="fragmentHeader" style="cursor: pointer; user-select: none;" onclick="toggleFragments()">
            <span id="fragmentCaret">&#9656;</span> Textbausteine
            <span class="muted">(Vorgaben bearbeiten)</span>
        </h3>
        <div id="fragmentBody" style="display: none;">
            <div id="fragmentList" class="fragment-list">
                <!-- Editable fragments populated here -->
            </div>
            <div class="frag-add">
                <div class="frag-row">
                    <input type="text" id="newFragment" maxlength="100" placeholder="Neuer Textbaustein…">
                    <button onclick="addFragment()">Hinzufügen</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container" id="configSection">
        <h3 id="configHeader" style="cursor: pointer; user-select: none;" onclick="toggleConfig()">
            <span id="configCaret">&#9656;</span> Konfiguration
        </h3>
        <div id="configBody" style="display: none;">
            <div class="frag-row" style="align-items: center;">
                <label for="defaultPlays">Standard-Wiederholungen:</label>
                <input type="number" id="defaultPlays" min="1" max="99" step="1" value="3"
                       style="width: 4em;" onchange="setDefaultPlays()">
                <span id="defaultPlaysStatus" class="muted"></span>
            </div>
            <div class="frag-row" style="align-items: center;">
                <label for="globalMaxPlays">Globales Wiederholungslimit (Obergrenze):</label>
                <input type="number" id="globalMaxPlays" min="1" max="99" step="1" value="3"
                       style="width: 4em;" onchange="setGlobalMaxPlays()">
                <span id="globalMaxPlaysStatus" class="muted"></span>
            </div>
        </div>
    </div>

    <div class="container" id="statusSection">
        <h3>Status <span id="clientsSummary" class="muted"></span></h3>
        <table class="clients">
            <thead>
                <tr>
                    <th></th><th>ID</th><th>IP</th><th>Ver</th>
                    <th>First seen</th><th>Last seen</th><th>Status</th>
                </tr>
            </thead>
            <tbody id="clientsBody"></tbody>
        </table>

        <div class="controls">
            <label><input type="checkbox" id="debugToggle" onchange="toggleDebugLog(this)"> Debug-Log anzeigen</label>
        </div>

        <!-- Debug log: hidden by default, only for error checking (toggle above). -->
        <div id="debugSection" style="display: none;">
            <h3>Debug Log</h3>
            <div class="controls">
                <label><input type="checkbox" onchange="toggleDebug(this)"> Heartbeats &amp; Acks anzeigen</label>
                <label><input type="checkbox" onchange="togglePause(this)"> Pause</label>
                <button onclick="clearLog()">Clear</button>
            </div>
            <div id="logWindow"></div>
        </div>
    </div>
</body>
</html>
